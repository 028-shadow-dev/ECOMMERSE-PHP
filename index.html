<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <link rel="stylesheet" href="FE/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <form action="BE/function.php" method="POST">
          <fieldset class="border rounded-3 p-4 bg-white shadow-sm">
            <legend class="w-auto">Daftar Akun</legend>

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com" required>
            </div>

            <div class="mb-3">
              <label for="nama" class="form-label">Nama</label>
              <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Buat password" autocomplete="new-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label">sudah ada akun?</label>
                <label class="text-danger text-decoration-none fw-bold"><a class="text-decoration-none" href="login.php">Login</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-100" name="register">Daftar Akun</button>
          </fieldset>
        </form>
      </div>
    </div>
  </main>
